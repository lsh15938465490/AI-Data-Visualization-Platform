services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/data.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    volumes:
      - viz-data:/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  viz-data:
